name: Catan public site privacy and smoke checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-privacy-and-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the public browser entry points
        run: |
          set -euo pipefail
          node --check assets/app.js
          node --check assets/site-data.js
          test -f assets/styles.css
          python - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          for asset in ('assets/app.js', 'assets/site-data.js', 'assets/styles.css'):
              assert asset in html, 'Missing public site dependency '+asset
              assert Path(asset).exists(), 'Missing referenced asset '+asset
          js=Path('assets/app.js').read_text()
          assert 'window.CATAN_DATA' in js, 'Public aggregate binding missing'
          print('Static entry points and public aggregate binding intact')
          PY
      - name: Enforce presentation-only public repository
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess,re
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          allowed={'index.html','README.md','.gitignore',
                   'assets/app.js','assets/site-data.js','assets/styles.css',
                   '.github/workflows/public-site-privacy-check.yml'}
          extras=sorted(set(filter(None,tracked))-allowed)
          assert not extras,'Unexpected public files: '+', '.join(extras)
          for src in ['index.html','assets/app.js','assets/site-data.js','assets/styles.css']:
              data=Path(src).read_text()
              assert not re.search(r'AKIA[0-9A-Z]{16}',data),'Possible AWS access key'
              assert not re.search(r'gh[pousr]_[A-Za-z0-9_]{32,}',data),'Possible GitHub token'
              assert not re.search(r'github_pat_[A-Za-z0-9_]{40,}',data),'Possible GitHub PAT'
          print('Public site allowlist validated; no research scripts or bulk data committed')
          PY
